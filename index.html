<!doctype html>
<html lang="en" style="background:#0d1017">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tempo</title>
    <script>
      window.addEventListener('error', (e) => {
        const stack = e.error && e.error.stack ? e.error.stack : ''
        const lines = stack.split('\n').filter((l) => l.includes('at ')).slice(0, 8).join(' | ')
        document.title = ('ERR: ' + (e.message || '') + ' :: ' + lines).slice(0, 900)
      })
      window.addEventListener('unhandledrejection', (e) => {
        document.title = 'REJ: ' + ((e.reason && e.reason.message) || String(e.reason))
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
