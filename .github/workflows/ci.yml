name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # cheapest signal first, so a typo does not wait on the Rust build
      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Check hook order
        run: npm run check:hooks

      - name: Lint frontend
        run: npm run lint

      # Not an npm package, so it comes from the pinned release. Also runs
      # shellcheck over the `run:` blocks, which is the part a broken workflow
      # cannot announce on its own.
      - name: Lint GitHub workflows
        shell: pwsh
        run: |
          $version = '1.7.12'
          $url = "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_windows_x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile actionlint.zip
          Expand-Archive -Path actionlint.zip -DestinationPath . -Force
          .\actionlint.exe

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
