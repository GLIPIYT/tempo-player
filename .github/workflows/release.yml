name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Locate npm download cache
        id: npm-cache-dir
        shell: pwsh
        run: '"path=$(npm config get cache)" >> $env:GITHUB_OUTPUT'

      # Reuse verified npm tarballs even when only the app version in the
      # lockfile changed. npm ci still validates the real lockfile/integrities.
      - name: Restore npm downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.path }}
          key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-downloads-${{ runner.os }}-${{ runner.arch }}-

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-msvc-deps-v1
          # Saving under a tag cannot help a different future tag.
          save-if: false

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      - name: Read annotated release notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${GITHUB_REF}^{tag}"
          delimiter="release_notes_${GITHUB_RUN_ID}_${RANDOM}"
          {
            printf 'body<<%s\n' "$delimiter"
            git for-each-ref --format='%(contents)' "$GITHUB_REF"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tempo ${{ github.ref_name }}'
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Publish the completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          installer="Tempo_${GITHUB_REF_NAME#v}_x64-setup.exe"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fx -- "$installer"
          notes_file="$(mktemp)"
          git for-each-ref --format='%(contents)' "$GITHUB_REF" > "$notes_file"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file" --draft=false --latest
