name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tempo ${{ github.ref_name }}'
          releaseBody: 'Windows installer (NSIS, x64).'
          releaseDraft: false
          prerelease: false

      # The updater shows the release body to the user as the changelog, so it
      # has to be the annotated tag's message rather than a placeholder.
      - name: Use the tag annotation as the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")
          if [ -z "$notes" ]; then
            notes=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes "$notes"
