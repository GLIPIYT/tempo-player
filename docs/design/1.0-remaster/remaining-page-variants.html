      },
      album:{
        a:()=>`${pageHead('Альбом','Локальная медиатека') }<div class="album-hero">${art('dusk')}<div><span class="pill">Альбом</span><h3>Night Signals</h3><p><b>Low Tide</b> · 2025 · 11 треков · 42 мин</p><div class="actions">${button('▶ Воспроизвести','primary')}${button('⤨ Перемешать','')}${button('♡','quiet')}</div></div></div><div class="section-head"><h3>Треки</h3><span class="muted">11 композиций</span></div>${trackTable(tracks.slice(0,8))}`,
        b:()=>`${pageHead('Night Signals','Альбом · 2025',button('⋯',''))}<div class="album-inline">${art('dusk')}<span class="album-inline-copy"><b>Low Tide</b><small>11 треков · 42 мин</small></span><div class="actions" style="margin-left:auto">${button('▶','primary')}${button('⤨','')}</div></div><div class="album-compact"><div><div class="list-tools"><span>Треклист</span><span>Добавлено в медиатеку · 14 мая</span></div>${trackTable(tracks.slice(0,8),{compact:true})}</div><aside class="album-compact-side">${art('dusk')}<span class="pill">Альбом</span><h3>Night Signals</h3><p>Low Tide · 2025</p><span class="layout-note">11 треков · 42 мин</span><div class="section-head"><h3>Похожие альбомы</h3></div>${releaseCards()}</aside></div>`
      },
      playlist:{
        a:()=>`${pageHead('Плейлист','Создан вами',button('⋯',''))}<div class="playlist-hero"><div><span class="pill">Плейлист</span><h3>Ночная дорога</h3><p>24 трека · обновлён 18 сентября</p><div class="actions">${button('▶ Воспроизвести','primary')}${button('⤨ Перемешать','')}${button('Изменить','quiet')}</div></div><div class="cover-mosaic">${['dusk','ice','violet','blue'].map(x=>art(x)).join('')}</div></div><div class="section-head"><h3>Треки</h3><span class="muted">Перетаскивайте, чтобы изменить порядок</span></div>${trackTable(tracks.slice(0,8),{compact:true})}`,
        b:()=>`${pageHead('Плейлисты','18 плейлистов',button('+ Новый плейлист','primary'))}<div class="playlist-detail-layout"><aside class="playlist-tools"><div class="cover-mosaic">${['dusk','ice','violet','blue'].map(x=>art(x)).join('')}</div><h3>Ночная дорога</h3><p>24 трека · ваш плейлист</p><div class="actions">${button('▶','primary')}${button('⤨','')}${button('⋯','quiet')}</div><div class="field"><label>Название</label><div class="fake-input">Ночная дорога</div></div><div class="field"><label>Описание</label><div class="fake-input">Для поездок после заката</div></div><span class="layout-note">Обложка из первых треков</span></aside><div><div class="searchbox" style="margin-bottom:10px">⌕ <span>Добавить или найти треки</span><span style="margin-left:auto">＋</span></div>${trackTable(tracks.slice(0,8),{compact:true})}</div></div>`
      },
      scArtist:{
        a:()=>`${pageHead('SoundCloud','Публичный профиль')}${artistHero('Low Tide',true)}<div class="section-head"><h3>Популярное</h3><span class="cache-state"><i class="cache-dot"></i>12 треков в кэше</span></div>${trackTable(tracks.slice(0,6),{compact:true,source:'SoundCloud'})}`,
        b:()=>`${pageHead('SoundCloud','Публичный профиль') }<div class="remote-layout"><aside class="remote-info">${art('dusk','round')}<span class="pill">Исполнитель</span><h3>Low Tide</h3><p>18 треков · SoundCloud</p><div class="actions">${button('▶ Слушать','primary')}${button('↧ Кэш','')}</div><div class="cache-meter"><i></i></div><div class="cache-label"><span>Кэшировано</span><span>12 / 18</span></div><div class="section-head"><h3>Релизы</h3></div>${releaseCards()}</aside><div><div class="list-tools"><span>Треки исполнителя</span><span>Сначала популярные</span></div><div class="remote-table">${trackTable(tracks.slice(0,7),{compact:true,source:'SoundCloud',cache:true})}</div></div></div>`
      },
      scPlaylist:{
        a:()=>`${pageHead('SoundCloud','Плейлист · Flickermood') }<div class="playlist-hero"><div><span class="pill">SoundCloud</span><h3>Late night textures</h3><p>34 трека · Flickermood</p><div class="actions">${button('▶ Слушать','primary')}${button('↧ Скачать','')}${button('В SoundCloud','quiet')}</div><div class="cache-state" style="margin-top:10px"><i class="cache-dot"></i>Кэшировано 27 из 34 треков</div></div><div class="cover-mosaic">${['violet','blue','dusk','ice'].map(x=>art(x)).join('')}</div></div><div class="cache-label"><span>Кэш плейлиста</span><span>79%</span></div><div class="cache-meter"><i></i></div><div class="section-head"><h3>Треки</h3><span class="muted">Доступные для воспроизведения</span></div>${trackTable(tracks.slice(0,7),{compact:true,source:'SoundCloud',cache:true})}`,
        b:()=>`${pageHead('SoundCloud','Коллекция пользователя') }<div class="remote-layout"><aside class="remote-info"><div class="cover-mosaic">${['violet','blue','dusk','ice'].map(x=>art(x)).join('')}</div><span class="pill">Плейлист</span><h3>Late night textures</h3><p>Flickermood · 34 трека</p><div class="actions">${button('▶ Воспроизвести','primary')}${button('↧ Скачать','')}</div><div class="section-head"><h3>Кэш</h3></div><div class="cache-meter"><i></i></div><div class="cache-label"><span>27 из 34 треков</span><span>79%</span></div></aside><div><div class="list-tools"><span>Список треков</span><span>Название ↕</span></div><div class="remote-table">${trackTable(tracks.slice(0,8),{compact:true,source:'SoundCloud',cache:true})}</div></div></div>`
      },
      yt:{
        a:()=>`${pageHead('YouTube Music','Коллекция · внешний источник') }<div class="remote-head yt-head">${art('amber')}<div><span class="pill warm">YouTube Music · альбом</span><h3>Soft Focus</h3><p>Mira Vale · 12 треков</p><div class="actions">${button('▶ Воспроизвести','primary')}${button('Сохранить в медиатеку','')}${button('Открыть ↗','quiet')}</div></div><span class="cache-state"><i class="cache-dot"></i>Локально доступно</span></div><div class="section-head"><h3>Треклист</h3><span class="muted">10 из 12 можно воспроизвести</span></div>${trackTable(tracks.slice(2,8),{compact:true,source:'Источник',cache:true})}`,
        b:()=>`${pageHead('YouTube Music','Коллекция · внешний источник') }<div class="yt-grid"><aside class="yt-card">${art('amber')}<span class="pill warm">Альбом</span><h3>Soft Focus</h3><p>Mira Vale · 12 треков</p>${button('▶ Воспроизвести','primary')}<div class="section-head"><h3>Сохранение</h3><span class="muted">54%</span></div><div class="yt-progress"><i></i></div><div class="cache-label"><span>Сохранено 6 из 11</span><span>Отмена</span></div></aside><div><div class="section-head" style="margin-top:0"><h3>Треки коллекции</h3><span class="muted">10 доступны · 2 недоступны</span></div>${trackTable(tracks.slice(2,9),{compact:true,source:'YouTube Music'})}<div class="layout-note" style="margin-top:9px"><i class="dot"></i>Недоступные треки остаются в списке</div></div></div>`
      },
      profile:{
        a:()=>`${pageHead('Ваш профиль','История прослушивания') }<div class="profile-top"><span class="profile-avatar">М</span><div class="profile-name"><h3>Моя музыка</h3><small>В Tempo с марта 2025</small></div><div class="stat"><b>126 ч</b><small>прослушано</small></div><div class="stat"><b>842</b><small>запуска</small></div><div class="stat"><b>86%</b><small>дослушано</small></div></div><section class="profile-activity"><div class="activity-title"><h3>Активность</h3><div style="display:flex;align-items:center;gap:8px"><span class="muted">Последние 12 месяцев</span><div class="activity-switch"><button type="button" data-profile-view="graph" aria-pressed="${profileView==='graph'}">График</button><button type="button" data-profile-view="grid" aria-pressed="${profileView==='grid'}">Сетка</button></div></div></div>${profileActivity()}</section><div class="profile-columns" style="margin-top:15px"><section class="top-list"><h3>Часто слушаете</h3>${artists.slice(0,3).map((a,i)=>`<div class="top-artist">${art(a.art,'round')}<span><b>${a.name}</b><small>${36-i*7} прослушиваний</small></span><span class="muted" style="margin-left:auto">${i+1}</span></div>`).join('')}</section><section class="top-list"><h3>Недавно</h3>${tracks.slice(0,3).map((t,i)=>`<div class="top-artist">${art(t.art)}<span><b>${t.title}</b><small>${t.artist}</small></span></div>`).join('')}</section></div>`,
        b:()=>`${pageHead('Профиль','Ваша музыкальная история') }<div class="profile-columns"><div><div class="profile-top" style="grid-template-columns:auto minmax(0,1fr)"><span class="profile-avatar">М</span><div class="profile-name"><h3>Моя музыка</h3><small>Начали слушать в марте 2025</small></div></div><div class="profile-activity"><div class="activity-title"><h3>Активность за год</h3><div class="activity-switch"><button type="button" data-profile-view="graph" aria-pressed="${profileView==='graph'}">График</button><button type="button" data-profile-view="grid" aria-pressed="${profileView==='grid'}">Сетка</button></div></div>${profileActivity()}</div><section class="top-list" style="margin-top:13px"><h3>Часто слушаемые исполнители</h3>${artists.map((a,i)=>`<div class="top-artist">${art(a.art,'round')}<span><b>${a.name}</b><small>${36-i*6} запусков</small></span></div>`).join('')}</section></div><div><section class="top-list"><h3>Итоги</h3><div class="stat" style="border:0;padding:9px 0"><b>126 ч</b><small>время прослушивания</small></div><div class="stat" style="border:0;padding:9px 0"><b>842</b><small>запуска треков</small></div><div class="stat" style="border:0;padding:9px 0"><b>86%</b><small>среднее дослушивание</small></div></section><section class="top-list" style="margin-top:13px"><h3>Любимые альбомы</h3>${releaseCards()}</section></div></div>`
      }
    };
    function profileActivity(){if(profileView==='grid'){return `<div class="heatmap" aria-label="Календарь прослушиваний">${Array.from({length:182},(_,i)=>`<i title="${i%7===0?'':'Прослушивания'}"></i>`).join('')}</div>`}return `<div class="graph"><svg viewBox="0 0 760 160" preserveAspectRatio="none" role="img" aria-label="График прослушиваний"><path d="M0 132 C45 128 48 80 94 92 S148 118 186 78 S235 34 278 68 S326 106 367 63 S417 42 454 75 S507 119 548 61 S607 26 645 55 S710 102 760 23" fill="none" stroke="var(--color-accent)" stroke-width="3"/><path d="M0 132 C45 128 48 80 94 92 S148 118 186 78 S235 34 278 68 S326 106 367 63 S417 42 454 75 S507 119 548 61 S607 26 645 55 S710 102 760 23 V160 H0Z" fill="url(#fade)" opacity=".2"/><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--color-accent)"/><stop offset="1" stop-color="var(--color-accent)" stop-opacity="0"/></linearGradient></defs></svg></div>`}
    function render(){
      const routeTabs=document.getElementById('route-tabs');
      routeTabs.innerHTML=Object.entries(pages).map(([id,item])=>`<button class="route-tab" type="button" data-page="${id}" aria-pressed="${page===id}">${item.nav}</button>`).join('');
      const navOrder=['library','search','artist','album','playlist','scArtist','scPlaylist','yt','profile'];
      document.getElementById('side-nav').innerHTML=`<div class="side-label">Медиатека</div>${navOrder.map(id=>`<div class="nav-item ${page===id?'active':''}"><span class="nav-icon">${{library:'▤',search:'⌕',artist:'◉',album:'▣',playlist:'☷',scArtist:'◍',scPlaylist:'♫',yt:'▶',profile:'○'}[id]}</span><span class="nav-label">${pages[id].nav}</span></div>`).join('')}<div class="side-gap"></div><div class="side-now">СЕЙЧАС ИГРАЕТ<b>After the Rain</b><i></i></div>`;
      document.getElementById('screen').innerHTML=screens[page][variant]();
      document.getElementById('concept-title').textContent=pages[page].label;
      document.getElementById('concept-description').textContent=pages[page].description;
      document.getElementById('variant-title').textContent=pages[page].variants[variant];
      document.getElementById('window-title').textContent=`Tempo / ${pages[page].nav}`;
      document.getElementById('app-shell').classList.toggle('is-narrow',narrow);
      document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));
      document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.width==='narrow')===narrow)));
      history.replaceState(null,'',`#page=${page}&variant=${variant}${narrow?'&width=narrow':''}`);
    }
    document.addEventListener('click',event=>{
      const target=event.target.closest('button');if(!target)return;
      if(target.dataset.page){page=target.dataset.page;render();return}
      if(target.dataset.variant){variant=target.dataset.variant;render();return}
      if(target.dataset.width){narrow=target.dataset.width==='narrow';render();return}
      if(target.dataset.profileView){profileView=target.dataset.profileView;render();return}
    });
    document.getElementById('screen').addEventListener('input',event=>{
      if(!event.target.matches('[data-filter]'))return;
      const query=event.target.value.trim().toLocaleLowerCase();
      document.querySelectorAll('#screen [data-search]').forEach(row=>row.hidden=!row.dataset.search.includes(query));
    });
    const params=new URLSearchParams(location.hash.slice(1));
    if(pages[params.get('page')])page=params.get('page');
    if(['a','b'].includes(params.get('variant')))variant=params.get('variant');
    narrow=params.get('width')==='narrow';
    render();
  </script>
</body>
</html>
