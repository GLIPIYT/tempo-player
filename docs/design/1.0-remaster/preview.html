  <style>

    .cover{width:100%;min-width:0}.cover .name{font-size:10px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cover .sub{font-size:9px;color:var(--muted);margin-top:2px}.cover-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.cover-grid.wide{grid-template-columns:repeat(5,minmax(0,1fr))}.section{margin-top:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.section-title span{font-size:9px;color:var(--muted)}.tracklist{display:grid;gap:2px}.track{min-width:0;display:grid;grid-template-columns:25px 32px minmax(0,1fr) 32px;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:9px}.track:hover{background:#202a2b}.track .num{color:#71817b;text-align:right}.track-art{width:30px;height:30px;border-radius:5px}.track-title{font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-by{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-time{text-align:right;color:#899791;font-size:8px}.panel{background:var(--surface);border:1px solid #293536;border-radius:var(--radius);padding:12px}.hero{display:grid;grid-template-columns:175px minmax(0,1fr);align-items:end;gap:17px;background:linear-gradient(115deg,#20322e,#182022 68%);border:1px solid #344540;border-radius:15px;padding:14px;margin-bottom:15px}.hero .art{box-shadow:0 10px 24px #0006}.hero-copy{padding:0 0 3px}.hero-copy p{font-size:9px;color:#b5c2bc;margin:8px 0 12px}.hero-actions{display:flex;gap:7px;flex-wrap:wrap}.statline{display:flex;gap:14px;flex-wrap:wrap;font-size:9px;color:var(--muted);margin-top:10px}.statline b{color:#edf3ef}.feature-row{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}.featured-track{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;padding:11px;background:#1a2425;border-radius:12px}.featured-track .art{width:92px}.featured-track p{font-size:9px;color:var(- r-radius:5px}.mosaic .art:first-child{grid-row:span 2}.mosaic .art b{font-size:12px}.hero.compact{grid-template-columns:100px minmax(0,1fr);padding:10px;gap:12px}.hero.compact .art{width:100px}.settings-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.settings-card{min-height:75px;background:var(--surface);border:1px solid #2b3938;border-radius:11px;padding:11px}.settings-card strong{font-size:10px}.settings-card p{font-size:8px;color:var(--muted);margin-top:5px}.settings-layout{display:grid;grid-template-columns:105px minmax(0,1fr);gap:10px}.setting-nav{display:grid;gap:3px;align-content:start}.setting-nav span{padding:6px;border-radius:6px;color:var(--muted);font-size:8px}.setting-nav span.active{background:#263630;color:var(--accent)}.setting-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #293435;font-size:9px}.toggle{width:27px;height:15px;border-radius:99px;background:#53665e;position:relative;flex:none}.toggle:after{content:"";position:absolute;right:2px;top:2px;width:11px;height:11px;background:#baf0d0;border-radius:50%}.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}.heatmap i{aspect-ratio:1;border-radius:2px;background:#1d2b28}.heatmap i:nth-child(4n),.heatmap i:nth-child(7n){background:#579675}.heatmap i:nth-child(5n){background:#a9e9c9}.source{display:flex;align-items:center;gap:6px;border-radius:6px;padding:4px 7px;background:#28352f;color:#c0d3c9;font-size:8px;width:max-content}.source.orange{background:#382c21;color:#e6ba86}.source.red{background:#39252c;color:#e7a5b8}.album-line{display:grid;grid-template-columns:33px 1fr 36px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #2a3535}.album-line .art{width:33px;border-radius:5px}.album-line strong{font-size:9px}.album-line small{display:block;color:var(--muted);font-size:8px}.queue-layout{display:grid;grid-template-columns:120px 1fr;gap:10px}.queue-side{display:grid;gap:7px;align-content:start}.queue-side .art{width:100%}.bars{height:32px;display:flex;gap:3px;align-items:end}.bars i{flex:1;background:#7bc39e;border-radius:3px 3px 0 0;opacity:.8}
    .icon-gallery{margin-top:40px}.icon-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.icon-grid figure{margin:0;background:#111819;border:1px solid #2b3837;border-radius:12px;padding:12px;text-align:center}.icon-grid img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:9px}.icon-grid figcaption{font-size:10px;color:var(--muted);padding-top:8px}

    @media(max-width:680px){.toolbar{flex-wrap:wrap;gap:10px}.modes{margin-left:auto}.app{grid-template-columns:55px minmax(0,1fr);grid-template-rows:46px 1fr 60px;min-height:620px}.side{padding:12px 5px}.logo{font-size:0;text-align:center;padding:0}.logo span{font-size:13px}.side-label,.side-foot{display:none}.side-item{font-size:0;text-align:center;padding:9px 2px}.side-item:first-letter{font-size:11px}.top{padding:0 10px}.content{padding:14px 10px}.player{gap:7px;padding:7px}.player-tools{display:none}.player{grid-template-columns:1fr 1.2fr}.hero{grid-template-columns:110px 1fr;gap:10px;padding:10px}.hero.compact{grid-template-columns:75px 1fr}.hero.compact .art{width:75px}.cover-grid,.cover-grid.wide{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:1fr}.filter-rail{grid-template-columns:repeat(2,1fr)}.table-head,.table-row{grid-template-columns:22px minmax(0,1fr) 35px}.table-head>*:nth-child(3),.table-row>*:nth-child(3){display:none}}

<body>
  <header class="toolbar">
    <div class="brand"><span class="brandmark">T</span><span>Tempo <small>визуальный ремастер · 1.0</small></span></div>
    <div class="toolbar-note">Одна палитра, две разные компоновки для каждой страницы</div>
    <div class="modes" aria-label="Режим просмотра">
      <button class="active" data-mode="both">Сравнить A / B</button><button data-mode="a">Только A</button><button data-mode="b">Только B</button>
    </div>
  </header>
  <main>
    <nav class="nav" id="page-nav" aria-label="Страницы Tempo"></nav>
    <section class="stage" id="stage">
      <article class="variant" id="variant-a"><div class="variant-label"><strong>A · Витрина</strong><span>просторная редакционная подача</span></div><div class="app" id="screen-a"></div></article>
      <article class="variant" id="variant-b"><div class="variant-label"><strong>B · Рабочее место</strong><span>плотное управление и быстрые действия</span></div><div class="app" id="screen-b"></div></article>
    </section>
    <section class="icon-gallery">
      <div class="section-title"><h2>Сохранённые варианты иконки</h2><span>Шесть цветовых вариантов Pulse и Orbit</span></div>
      <div class="icon-grid">
        <figure><img src="../../brand/icon-concepts/variants/pulse-cream-coral.png" alt="Pulse — кремовый и коралловый"><figcaption>Pulse · Cream / Coral</figcaption></figure>
        <figure><img src="../../brand/icon-concepts/variants/pulse-forest-lime.png" alt="Pulse — лесной и лаймовый"><figcaption>Pulse · Forest / Lime</figcaption></figure>
        <figure><img src="../../brand/icon-concepts/variants/pulse-violet-cyan.png" alt="Pulse — фиолетовый и циан"><figcaption>Pulse · Violet / Cyan</figcaption></figure>
        <figure><img src="../../brand/icon-concepts/variants/orbit-indigo-cyan.png" alt="Orbit — индиго и циан"><figcaption>Orbit · Indigo / Cyan</figcaption></figure>
        <figure><img src="../../brand/icon-concepts/variants/orbit-ivory-coral.png" alt="Orbit — слоновая кость и коралловый"><figcaption>Orbit · Ivory / Coral</figcaption></figure>
        <figure><img src="../../brand/icon-concepts/variants/orbit-plum-lime.png" alt="Orbit — сливовый и лаймовый"><figcaption>Orbit · Plum / Lime</figcaption></figure>
      </div>
    </section>
  </main>
  <script>
    const pages=[
      ['home','Главная'],['library','Медиатека'],['search','Поиск'],['albums','Альбомы'],['artists','Исполнители'],['playlists','Плейлисты'],['profile','Профиль'],['settings','Настройки'],['album','Страница альбома'],['artist','Страница исполнителя'],['playlist','Страница плейлиста'],['sc-artist','SoundCloud · исполнитель'],['sc-playlist','SoundCloud · плейлист'],['yt-collection','YouTube Music · коллекция']
    ];
    const art=(n=1,label='')=>`<div class="art a${n}"><b>${label||['NOCTURNE','NORTH','MOTION','AFTERGLOW','BLUE HOUR','SLOW DIVE'][((n-1)%6)]}</b></div>`;
    const cover=(name,by,n=1)=>`<div class="cover">${art(n)}<div class="name">${name}</div><div class="sub">${by}</div></div>`;
    const track=(i,title,by,n=1,time='3:42')=>`<div class="track"><span class="num">${i}</span><div class="track-art">${art(n,title.slice(0,1))}</div><div><div class="track-title">${title}</div><div class="track-by">${by}</div></div><span class="track-time">${time}</span></div>`;
    const tracks=(count=5)=>`<div class="tracklist">${[['Midnight City','M83',1,'4:03'],['A Walk','Tycho',2,'5:16'],['Open Eye Signal','Jon Hopkins',3,'7:48'],['Retrograde','James Blake',4,'3:43'],['Taro','alt-J',5,'5:15'],['Kerala','Bonobo',6,'3:57']].slice(0,count).map((t,i)=>track(String(i+1).padStart(2,'0'),...t)).join('')}</div>`;
    const table=(count=7)=>`<div class="table-head"><span>#</span><span>ТРЕК</span><span>АЛЬБОМ</span><span>ВРЕМЯ</span></div>${[['Midnight City','M83 · Hurry Up, We’re Dreaming',1,'4:03'],['A Walk','Tycho · Dive',2,'5:16'],['Open Eye Signal','Jon Hopkins · Immunity',3,'7:48'],['Retrograde','James Blake · Overgrown',4,'3:43'],['Taro','alt-J · An Awesome Wave',5,'5:15'],['Kerala','Bonobo · Migration',6,'3:57'],['Nightcall','Kavinsky · OutRun',1,'4:18'],['Holocene','Bon Iver · Bon Iver',2,'5:36']].slice(0,count).map((t,i)=>`<div class="table-row"><span class="muted">${String(i+1).padStart(2,'0')}</span><span><b>${t[0]}</b><small>${t[1].split(' · ')[0]}</small></span><span class="muted">${t[1].split(' · ')[1]}</span><span class="muted">${t[3]}</span></div>`).join('')}`;
    const albums=(n=4)=>`<div class="cover-grid">${[['Hurry Up, We’re Dreaming','M83',1],['Dive','Tycho',2],['Immunity','Jon Hopkins',3],['Overgrown','James Blake',4],['Migration','Bonobo',5]].slice(0,n).map(x=>cover(...x)).join('')}</div>`;
    const artists=(n=4)=>`<div class="directory">${[['M83','1.2k треков',1],['Tycho','94 трека',2],['Bonobo','82 трека',3],['James Blake','47 треков',4],['The xx','39 треков',5],['London Grammar','28 треков',6]].slice(0,n).map(x=>`<div class="directory-item"><div class="avatar-art art a${x[2]}"><b class="initials">${x[0].slice(0,1)}</b></div><span><b>${x[0]}</b><small class="muted" style="display:block">${x[1]}</small></span></div>`).join('')}</div>`;
    const head=(title,subtitle,action='')=>`<div class="page-head"><div><div class="eyebrow">TEMPO · КОЛЛЕКЦИЯ</div><h1>${title}</h1><p>${subtitle}</p></div>${action?`<button class="button ghost">${action}</button>`:''}</div>`;
