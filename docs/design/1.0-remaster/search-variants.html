    @media(max-width:680px){.preview-bar{position:static;gap:10px;padding:10px}.back-link{margin-left:auto}.preview-controls{width:100%;justify-content:space-between}.showcase{width:calc(100% - 10px);padding-top:13px}.showcase-top{align-items:start}.showcase-top h1{font-size:22px}.app-shell{height:720px;grid-template-columns:1fr;grid-template-rows:27px minmax(0,1fr) 62px;border-radius:10px}.app-shell .sidebar{display:none}.app-shell .workspace{grid-column:1;grid-row:2}.app-shell .playerbar{grid-column:1;grid-row:3;padding-inline:11px}.app-shell .topbar{padding-inline:10px}.app-shell .screen{padding:14px 11px 20px}.app-shell.is-narrow{grid-template-columns:1fr}.app-shell.is-narrow .sidebar{display:none}.app-shell.is-narrow .workspace{grid-column:1}.app-shell .track-first,.app-shell .catalog-layout,.app-shell .best-layout,.app-shell .best-bottom{grid-template-columns:minmax(0,1fr)}.app-shell .track-aside,.app-shell .type-rail{display:none}.app-shell .source-grid{grid-template-columns:minmax(0,1fr)}.app-shell .source-lane{display:block}.app-shell .lane-result{display:grid}.app-shell .spotlight{grid-template-columns:94px minmax(0,1fr);gap:10px;min-height:140px;padding:10px}.app-shell .spotlight .art{width:88px;height:88px}.app-shell .spotlight h3{font-size:18px}.app-shell .spotlight p{font-size:9px}.app-shell .cover-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.app-shell .result-row{grid-template-columns:18px 35px minmax(0,1fr) 40px;gap:7px;padding-inline:3px}.app-shell .result-row .art{width:34px;height:34px}.app-shell .result-row .provider-tag{display:none}.app-shell .toolbar{align-items:flex-start;flex-direction:column}.app-shell .source-filter{font-size:8px}.app-shell .playerbar{grid-template-columns:1fr 1fr}.app-shell .now-cover{width:35px;height:35px}.app-shell .transport .progress{display:none}.app-shell .top-search{display:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="preview-bar">
    <a class="preview-brand" href="./remaining-page-variants.html#page=search" aria-label="Tempo: все страницы"><span class="tempo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong>Tempo</strong></a>
    <a class="back-link" href="./remaining-page-variants.html#page=search">← Все страницы</a>
    <div class="preview-controls">
      <div class="segmented" role="group" aria-label="Вариант поиска"><button type="button" data-variant="a" aria-pressed="true">A</button><button type="button" data-variant="b" aria-pressed="false">Б</button><button type="button" data-variant="c" aria-pressed="false">В</button><button type="button" data-variant="d" aria-pressed="false">Г</button></div>
      <div class="segmented" role="group" aria-label="Ширина окна"><button type="button" data-width="wide" aria-pressed="true">Широкое</button><button type="button" data-width="narrow" aria-pressed="false">Узкое</button></div>
    </div>
  </header>
  <main class="showcase">
    <div class="showcase-top"><div><h1>Поиск</h1><p>Четыре компоновки · один набор результатов</p></div><span class="variant-name" id="variant-name">A · Треки в фокусе</span></div>
    <section class="app-shell" id="app-shell" aria-label="Предпросмотр поиска Tempo">
      <div class="titlebar"><span>Tempo / Поиск</span><span class="window-buttons" aria-hidden="true"><span>—</span><span>□</span><span>×</span></span></div>
      <aside class="sidebar" aria-label="Навигация">
        <div class="side-caption">Медиатека</div>
        <div class="side-item"><span class="side-icon">▤</span><span>Главная</span></div>
        <div class="side-item active"><span class="side-icon">⌕</span><span>Поиск</span></div>
        <div class="side-item"><span class="side-icon">◉</span><span>Исполнители</span></div>
        <div class="side-item"><span class="side-icon">▣</span><span>Альбомы</span></div>
        <div class="side-item"><span class="side-icon">☷</span><span>Плейлисты</span></div>
        <div class="side-item"><span class="side-icon">♡</span><span>Лайки</span></div>
        <div class="side-player">СЕЙЧАС ИГРАЕТ<b>After the Rain</b><i></i></div>
      </aside>
      <div class="workspace">
        <div class="topbar"><button class="nav-button" type="button" aria-label="Назад">‹</button><button class="nav-button" type="button" aria-label="Вперёд">›</button><div class="top-search">⌕ <span>Найти музыку</span></div><span class="avatar" aria-label="Профиль">М</span></div>
        <div class="screen" id="screen"></div>
      </div>
      <footer class="playerbar"><div class="now-playing"><span class="art rain now-cover"></span><span class="now-copy"><b>After the Rain</b><small>Low Tide · Night Signals</small></span></div><div class="transport"><div class="transport-controls"><span>⇄</span><span>◂</span><button class="play-button" type="button" aria-label="Пауза">Ⅱ</button><span>▸</span><span>↻</span></div><div class="progress"><i></i></div></div><div class="player-tools"><span>♫</span><span>▤</span><span>◖</span><span class="volume"><i></i></span></div></footer>
    </section>
  </main>
  <script>
    const tracks=[
      {title:'After the Rain',artist:'Low Tide',album:'Night Signals',time:'3:42',source:'tempo',art:'rain',state:'В медиатеке',type:'track'},
      {title:'After the Rain (Radio Edit)',artist:'Low Tide',album:'Night Signals',time:'3:18',source:'soundcloud',art:'signal',state:'В кэше',type:'track'},
      {title:'After the Rain',artist:'Low Tide',album:'Night Signals',time:'3:42',source:'youtube',art:'north',state:'Доступен',type:'track'},
      {title:'After Rain',artist:'Serein',album:'Northbound',time:'4:05',source:'tempo',art:'north',state:'В медиатеке',type:'track'},
      {title:'Rain on Glass',artist:'Mira Vale',album:'Soft Focus',time:'3:56',source:'soundcloud',art:'focus',state:'В сети',type:'track'},
      {title:'After the Rain — Live',artist:'Low Tide',album:'Live at North Hall',time:'5:11',source:'youtube',art:'blue',state:'Доступен',type:'track'}
    ];
    const albums=[
      {title:'Night Signals',artist:'Low Tide',detail:'11 треков · 2025',source:'tempo',art:'rain',type:'album'},
      {title:'After the Rain',artist:'Low Tide',detail:'Сингл · 2024',source:'youtube',art:'north',type:'album'},
      {title:'Soft Focus',artist:'Mira Vale',detail:'12 треков · 2025',source:'soundcloud',art:'focus',type:'album'},
      {title:'Northbound',artist:'Serein',detail:'9 треков · 2023',source:'tempo',art:'signal',type:'album'}
    ];
    const artists=[
      {title:'Low Tide',artist:'38 треков · 5 альбомов',detail:'Исполнитель',source:'tempo',art:'rain',type:'artist'},
      {title:'Mira Vale',artist:'24 трека · 3 альбома',detail:'Исполнитель',source:'youtube',art:'focus',type:'artist'},
      {title:'Serein',artist:'31 трек · 4 альбома',detail:'Исполнитель',source:'soundcloud',art:'north',type:'artist'}
    ];
    const playlists=[
      {title:'Ночная дорога',artist:'Ваш плейлист',detail:'24 трека',source:'tempo',art:'signal',type:'playlist'},
      {title:'Rain after dark',artist:'Low Tide',detail:'18 треков',source:'soundcloud',art:'rain',type:'playlist'},
      {title:'Late night mix',artist:'Микс YouTube Music',detail:'30 треков',source:'youtube',art:'blue',type:'playlist'}
    ];
    const typeLabels={track:'Треки',album:'Альбомы',artist:'Исполнители',playlist:'Плейлисты'};
    const sourceLabels={tempo:'Tempo',soundcloud:'SoundCloud',youtube:'YouTube Music'};
    const sourceMarks={tempo:'T',soundcloud:'◖',youtube:'▶'};
    const variantLabels={a:'A · Треки в фокусе',b:'Б · По источникам',c:'В · По типу результата',d:'Г · Лучшее совпадение'};
    let variant='a';let narrow=false;let type='track';let source='all';let query='after the rain';
    function art(name,extra=''){return `<span class="art ${name} ${extra}" aria-hidden="true"></span>`}
    function sourceTag(id){return `<span class="provider-tag"><i class="source-dot ${id==='soundcloud'?'sc':id==='youtube'?'yt':''}"></i>${sourceLabels[id]}</span>`}
    function status(item){return `<span class="status ${item.source==='soundcloud'&&item.state==='В сети'?'online':''}">${item.state}</span>`}
    function resultRow(item,index){return `<div class="result-row" data-search="${`${item.title} ${item.artist} ${item.album??item.detail??''}`.toLocaleLowerCase()}" data-source="${item.source}" data-type="${item.type}"><span class="result-rank">${index+1}</span>${art(item.art,`result-art${item.type==='artist'?' round':''}`)}<span class="result-copy"><b>${item.title}</b><small>${item.artist}${item.album?` · ${item.album}`:''}</small></span>${sourceTag(item.source)}<span class="result-time">${item.time??''}</span></div>`}
    function laneRow(item){return `<div class="lane-result" data-search="${`${item.title} ${item.artist} ${item.album??item.detail??''}`.toLocaleLowerCase()}" data-source="${item.source}" data-type="${item.type}">${art(item.art)}<span class="lane-copy"><b>${item.title}</b><small>${item.artist}${item.album?` · ${item.album}`:''}</small></span><span class="play">▶</span></div>`}
    function miniResult(item){return `<div class="side-result" data-search="${`${item.title} ${item.artist}`.toLocaleLowerCase()}" data-source="${item.source}" data-type="${item.type}">${art(item.art)}<span><b>${item.title}</b><small>${item.artist} · ${sourceLabels[item.source]}</small></span></div>`}
    function card(item){const shape=item.type==='artist'?'artist':'';return `<button type="button" class="cover-card ${shape}" data-search="${`${item.title} ${item.artist} ${item.detail??''}`.toLocaleLowerCase()}" data-source="${item.source}" data-type="${item.type}">${art(item.art)}<b>${item.title}</b><small>${item.artist} · ${item.detail??sourceLabels[item.source]}</small></button>`}
    function escapeAttribute(value){return value.replace(/[&"<>]/g,char=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[char]))}
    function searchField(){return `<label class="search-field"><span class="search-glass" aria-hidden="true">⌕</span><input type="search" value="${escapeAttribute(query)}" aria-label="Поиск музыки" data-query><kbd>Esc</kbd></label>`}
    function sourceFilters(){return `<div class="sources" aria-label="Источники"><button class="source-filter" data-source-filter="all" aria-pressed="${source==='all'}">Все источники</button><button class="source-filter" data-source-filter="tempo" aria-pressed="${source==='tempo'}"><i class="source-dot"></i>Tempo</button><button class="source-filter" data-source-filter="soundcloud" aria-pressed="${source==='soundcloud'}"><i class="source-dot sc"></i>SoundCloud</button><button class="source-filter" data-source-filter="youtube" aria-pressed="${source==='youtube'}"><i class="source-dot yt"></i>YouTube Music</button></div>`}
    function typeTabs(){return `<div class="tabs" role="tablist" aria-label="Тип результата">${Object.entries(typeLabels).map(([key,label])=>`<button class="tab" type="button" role="tab" data-type-filter="${key}" aria-pressed="${type===key}">${label}<span class="tab-count">${key==='track'?6:key==='album'?4:key==='artist'?3:3}</span></button>`).join('')}</div>`}
    function toolbar(){return `<div class="toolbar">${typeTabs()}${sourceFilters()}</div>`}
    function panel(title,content,tail=''){return `<section class="aside-section"><div class="section-title"><h3>${title}</h3>${tail?`<span>${tail}</span>`:''}</div>${content}</section>`}
    function pageHead(subtitle){return `<div class="page-heading"><div><h2>Поиск</h2><small>${subtitle}</small></div><span class="status">3 источника</span></div>`}
    function renderTrackFirst(){
      const results={track:tracks,album:albums,artist:artists,playlist:playlists}[type];
      return `${pageHead('Результаты по запросу «After the Rain»')}${searchField()}${toolbar()}<div class="track-first"><div class="track-main"><div class="result-heading"><h3>${typeLabels[type]}</h3><small>Сначала точные совпадения</small></div>${results.map(resultRow).join('')}<div class="section-title"><h3>Ещё результаты</h3><span>Похожие коллекции</span></div><div class="side-result-grid">${[albums[0],playlists[1]].map(miniResult).join('')}</div></div><aside class="track-aside">${panel('Лучшее совпадение',`<div class="match-card" data-search="after the rain low tide night signals" data-source="tempo" data-type="track">${art('rain')}<h4>After the Rain</h4><p>Low Tide · Night Signals</p><div class="match-actions"><button class="button primary" type="button">▶ Слушать</button><button class="button" type="button">⋯</button></div></div>`,`Tempo`)}${panel('Ещё нашли', [albums[0],artists[0]].map(miniResult).join(''))}</aside></div>`
    }
    function renderSources(){
      const groups={tempo:[tracks[0],tracks[3],albums[0]],soundcloud:[tracks[1],tracks[4],playlists[1]],youtube:[tracks[2],tracks[5],albums[1]]};
      return `${pageHead('9 совпадений из всех источников')}${searchField()}<div class="toolbar">${sourceFilters()}<span class="provider-tag">Показываем по источнику</span></div><div class="source-grid">${Object.entries(groups).map(([key,items])=>`<section class="source-lane"><header class="lane-head"><span class="lane-name"><i class="provider-mark ${key==='soundcloud'?'sc':key==='youtube'?'yt':''}">${sourceMarks[key]}</i>${sourceLabels[key]}</span><span class="lane-count">${items.length} результата</span></header><div class="lane-state">${key==='tempo'?'В медиатеке':key==='soundcloud'?'Поток · 1 в кэше':'Можно воспроизводить'}</div>${items.map(laneRow).join('')}<footer class="lane-footer"><span>${key==='tempo'?'Локальный поиск':key==='soundcloud'?'Публичные результаты':'YouTube Music'}</span><span>Все результаты　›</span></footer></section>`).join('')}</div>`
    }
    function selectedTypeContent(){
      const data={track:tracks,album:albums,artist:artists,playlist:playlists}[type];
      if(type==='track')return `<div class="type-tracks">${data.map(resultRow).join('')}</div>`;
      return `<div class="cover-grid ${type==='playlist'?'type-playlists':''}">${data.map(card).join('')}</div>`;
    }
    function renderTypeFirst(){
      return `${pageHead('Найдено по названию и исполнителю')}${searchField()}<div class="toolbar">${sourceFilters()}<span class="provider-tag">Точное и похожее совпадение</span></div><div class="catalog-layout"><nav class="type-rail" aria-label="Тип результата">${Object.entries(typeLabels).map(([key,label])=>`<button type="button" class="type-item" data-type-filter="${key}" aria-pressed="${type===key}"><span>${label}</span><span class="count">${key==='track'?6:key==='album'?4:key==='artist'?3:3}</span></button>`).join('')}</nav><section class="catalog-main"><div class="catalog-toolbar"><h3>${typeLabels[type]}</h3><span class="provider-tag">Релевантность ↓</span></div><div id="type-content">${selectedTypeContent()}</div></section></div>`
    }
    function renderBestMatch(){
      const alternates=[tracks[1],tracks[2],tracks[5]];
      return `${pageHead('Точное совпадение найдено в трёх источниках')}${searchField()}<div class="best-layout"><section class="spotlight">${art('rain')}<div><span class="match-label">● Точное совпадение</span><h3>After the Rain</h3><p>Low Tide · Night Signals · 3:42</p><div class="spotlight-meta"><span class="source-pill">${sourceTag('tempo')} В медиатеке</span><span class="source-pill">Альбом · 2025</span></div><div class="match-actions"><button class="button primary" type="button">▶ Слушать</button><button class="button" type="button">♡ В избранное</button></div></div></section><section class="alternate-list"><div class="section-title"><h3>Другие версии</h3><span>2 источника</span></div>${alternates.map(item=>`<div class="alternate-row" data-search="${`${item.title} ${item.artist}`.toLocaleLowerCase()}" data-source="${item.source}" data-type="track">${art(item.art)}<span><b>${item.title}</b><small>${item.artist} · ${item.album}</small></span>${sourceTag(item.source)}</div>`).join('')}</section></div><div class="best-bottom"><section class="alternate-list"><div class="section-title"><h3>Альбомы</h3><span>4 совпадения</span></div>${albums.slice(0,3).map(item=>`<div class="collection-row" data-search="${`${item.title} ${item.artist}`.toLocaleLowerCase()}" data-source="${item.source}" data-type="album">${art(item.art)}<span style="min-width:0;flex:1"><b>${item.title}</b><small>${item.artist} · ${item.detail}</small></span>${sourceTag(item.source)}</div>`).join('')}</section><section class="alternate-list"><div class="section-title"><h3>Исполнители</h3><span>3 совпадения</span></div>${artists.map(item=>`<div class="collection-row" data-search="${`${item.title} ${item.artist}`.toLocaleLowerCase()}" data-source="${item.source}" data-type="artist">${art(item.art,'round')}<span style="min-width:0;flex:1"><b>${item.title}</b><small>${item.artist}</small></span>${sourceTag(item.source)}</div>`).join('')}</section></div>`
    }
    const renderers={a:renderTrackFirst,b:renderSources,c:renderTypeFirst,d:renderBestMatch};
    function applyFilters(){
      const query=(document.querySelector('[data-query]')?.value??'').trim().toLocaleLowerCase();
      document.querySelectorAll('#screen [data-search]').forEach(row=>{
        const matchesQuery=row.dataset.search.includes(query);
        const matchesSource=source==='all'||row.dataset.source===source;
        const matchesType=variant!=='a'||row.dataset.type===type||row.dataset.type===undefined;
        row.hidden=!(matchesQuery&&matchesSource&&matchesType);
      });
    }
    function render(){
      document.getElementById('screen').innerHTML=renderers[variant]();
      applyFilters();
      document.getElementById('variant-name').textContent=variantLabels[variant];
      document.getElementById('app-shell').classList.toggle('is-narrow',narrow);
      document.querySelectorAll('[data-variant]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.variant===variant)));
      document.querySelectorAll('[data-width]').forEach(button=>button.setAttribute('aria-pressed',String((button.dataset.width==='narrow')===narrow)));
      history.replaceState(null,'',`#variant=${variant}&width=${narrow?'narrow':'wide'}&type=${type}`);
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.dataset.variant){variant=button.dataset.variant;render();return}
      if(button.dataset.width){narrow=button.dataset.width==='narrow';render();return}
      if(button.dataset.typeFilter){type=button.dataset.typeFilter;render();return}
      if(button.dataset.sourceFilter){source=button.dataset.sourceFilter;render();return}
    });
    document.getElementById('screen').addEventListener('input',event=>{
      if(event.target.matches('[data-query]')){query=event.target.value;applyFilters()}
    });
    const params=new URLSearchParams(location.hash.slice(1));
    if(['a','b','c','d'].includes(params.get('variant')))variant=params.get('variant');
    narrow=params.get('width')==='narrow';
    if(['track','album','artist','playlist'].includes(params.get('type')))type=params.get('type');
    render();
  </script>
</body>
</html>
