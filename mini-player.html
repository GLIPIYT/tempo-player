    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tempo Mini Player</title>

         grey rectangle. -->

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/mini-player/main.tsx"></script>
  </body>
