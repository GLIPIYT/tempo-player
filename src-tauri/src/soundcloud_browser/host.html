<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tempo SoundCloud playback</title>
  </head>
  <body>
    <iframe
      id="sc-widget"
      title="SoundCloud playback"
      allow="autoplay; encrypted-media"
      referrerpolicy="strict-origin-when-cross-origin"
      src="about:blank"
      style="position:fixed;width:1px;height:1px;left:0;top:0;border:0;opacity:0;pointer-events:none"
    ></iframe>
    <script src="/host.js" defer></script>
  </body>
</html>
