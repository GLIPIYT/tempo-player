[package]
name = "tempo"
version = "0.2.0"
description = "Tempo - local-first desktop music player"
edition = "2021"

[lib]
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# common-controls-v6 is off: it imports TaskDialogIndirect, which needs a
# Common-Controls v6 manifest that tauri-build embeds into bins only — test
# binaries then fail to load. Nothing in Tempo uses TaskDialog tray/menus.
tauri = { version = "2", default-features = false, features = [
    "wry",
    "compression",
    "dynamic-acl",
    "x11",
    "dbus",
    "protocol-asset",
] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["time", "macros", "rt", "fs"] }
futures-util = "0.3"
regex = "1"
# covers are downscaled before upload so discord's media proxy can fetch them reliably
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
